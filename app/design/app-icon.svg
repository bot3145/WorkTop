<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ebf6ff"/>
      <stop offset="1" stop-color="#c9e2ff"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="100%" r="62%">
      <stop offset="0" stop-color="#7cbcff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7cbcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="16%" cy="10%" r="46%">
      <stop offset="0" stop-color="#ffc9e0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffc9e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="88%" cy="16%" r="44%">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ball" cx="38%" cy="24%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f3fbff"/>
      <stop offset="0.72" stop-color="#cfe8ff"/>
      <stop offset="1" stop-color="#a2caee"/>
    </radialGradient>
    <radialGradient id="ballGlow" cx="50%" cy="90%" r="58%">
      <stop offset="0" stop-color="#6fb8ff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#6fb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="18%" y1="6%" x2="82%" y2="96%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#cfe8fb" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7fb9e8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="26%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#3b5273"/>
      <stop offset="0.62" stop-color="#26374f"/>
      <stop offset="1" stop-color="#16233a"/>
    </radialGradient>
    <radialGradient id="bulb" cx="34%" cy="28%" r="74%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dff0ff"/>
      <stop offset="1" stop-color="#6fb8ff"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="card">
      <rect x="0" y="0" width="1024" height="1024" rx="228"/>
    </clipPath>
    <clipPath id="ballClip">
      <circle cx="512" cy="545" r="300"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#warm)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#cool)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#pool)"/>

    <ellipse cx="512" cy="884" rx="248" ry="44" fill="#5d8fbf" opacity="0.3" filter="url(#blurL)"/>

    <g transform="rotate(-16 512 545)" opacity="0.92">
      <ellipse cx="512" cy="545" rx="372" ry="148" fill="none" stroke="#63a8e2" stroke-opacity="0.62"
        stroke-width="6" stroke-dasharray="18 26" stroke-linecap="round"/>
      <circle cx="884" cy="545" r="54" fill="url(#sun)"/>
      <circle cx="884" cy="545" r="18" fill="#ffffff"/>
      <circle cx="884" cy="545" r="9" fill="#6ec2ff"/>
    </g>

    <g>
      <rect x="506" y="170" width="12" height="94" rx="6" fill="#8fc9ef"/>
      <rect x="506" y="170" width="5" height="94" rx="2.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="512" cy="152" r="52" fill="url(#sun)" opacity="0.85"/>
      <circle cx="512" cy="152" r="23" fill="url(#bulb)"/>
      <circle cx="504" cy="144" r="7.5" fill="#ffffff" opacity="0.98"/>
    </g>

    <circle cx="512" cy="545" r="300" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)">
      <circle cx="512" cy="545" r="300" fill="url(#ballGlow)"/>
      <ellipse cx="512" cy="792" rx="252" ry="96" fill="#4f8ac2" opacity="0.2" filter="url(#blurL)"/>
    </g>
    <circle cx="512" cy="545" r="295.5" fill="none" stroke="url(#rim)" stroke-width="9"/>
    <circle cx="512" cy="545" r="292" fill="none" stroke="#5f9ed6" stroke-opacity="0.45" stroke-width="3"/>
    <ellipse cx="420" cy="398" rx="152" ry="94" fill="url(#spec)" transform="rotate(-28 420 398)"/>
    <ellipse cx="628" cy="722" rx="62" ry="34" fill="#ffffff" opacity="0.34" filter="url(#blurS)" transform="rotate(-24 628 722)"/>

    <ellipse cx="336" cy="592" rx="46" ry="24" fill="#ff9ec4" opacity="0.5" filter="url(#blurS)"/>
    <ellipse cx="688" cy="592" rx="46" ry="24" fill="#ff9ec4" opacity="0.5" filter="url(#blurS)"/>

    <ellipse cx="406" cy="502" rx="33" ry="42" fill="url(#eye)"/>
    <ellipse cx="618" cy="502" rx="33" ry="42" fill="url(#eye)"/>
    <circle cx="394" cy="486" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="606" cy="486" r="12" fill="#ffffff" opacity="0.95"/>

    <path d="M466 610 Q512 654 558 610" fill="none" stroke="#2b3d59" stroke-width="15" stroke-linecap="round" opacity="0.9"/>

    <circle cx="252" cy="352" r="13" fill="#ffffff" opacity="0.9"/>
    <circle cx="252" cy="352" r="26" fill="url(#sun)" opacity="0.5"/>
    <circle cx="806" cy="286" r="9" fill="#ffffff" opacity="0.75"/>
  </g>

  <rect x="2.5" y="2.5" width="1019" height="1019" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5"/>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1024" height="1024" filter="url(#grain)" opacity="0.05"/>
  </g>
</svg>
