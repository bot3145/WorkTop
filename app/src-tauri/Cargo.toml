[package]
name = "pwb-app"
version = "3.0.0"
description = "Worktop — 本地优先的个人工作台桌面版（数据格式与 pwb-lite 兼容）"
edition = "2021"
license = "MIT"
authors = ["Worktop contributors"]
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
scrypt = "0.11"
aes-gcm = "0.10"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "io-util"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# AI：OpenAI 兼容接口（流式 SSE）+ 本地时间戳
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"     # 体积优先（个人本地工具，性能足够）
lto = true
strip = true
codegen-units = 1
